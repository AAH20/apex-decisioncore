[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-decisioncore"
version = "1.0.0"
description = "Sovereign Sub-Microsecond Non-LLM Decision Model OS: Jev State Space, MiroFish NP-Hard Solver, Laya CBF Shield, & Clef Runtime"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Ahmed Hassan", email = "aah@apex.local"}
]
keywords = [
    "decision-models",
    "jev",
    "cloudflare-clef",
    "real-time-ai",
    "robotics",
    "neuromorphic",
    "control-barrier-functions",
    "formal-verification",
    "np-hard",
    "submodular-optimization",
    "edge-ai",
    "autonomous-systems",
    "drone-swarm",
    "hft",
    "zero-trust",
    "defense-tech"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
decisioncore = "apex_decisioncore.cli:main"
